<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Mirrors ThemeProvider before React mounts, so dark mode doesn't flash light -->
    <script>
      try {
        const stored = localStorage.getItem("vite-ui-theme");
        const dark =
          stored === "dark" ||
          (stored !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.add(dark ? "dark" : "light");
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", dark ? "#0a0a0a" : "#efeee9");
      } catch {}
    </script>
    <title>Countdown – share a countdown to any moment</title>
    <meta
      name="description"
      content="Create a countdown (or count-up) to any moment and share it as a link. No account, nothing stored on a server."
    />
    <!--og-->
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
